      const n=value=>formatted(value),unit=chosen.minutes<60?'reset':chosen.window.windowMinutes>=1440&&chosen.minutes>=1440?'day':'hour',points=unit==='reset'?chosen.remaining:chosen.remaining/(chosen.minutes/(unit==='day'?1440:60));
      $('coach-comparison').textContent=`${t('coachUsed')} ${n(100-chosen.remaining)}% · ${t('coachElapsed')} ${n(100-chosen.timeLeft)}%`;
      $('coach-reference').textContent=unit==='reset'?`${t('coachUntil')} · ${formatted(points,1)}%`:`${t(unit==='day'?'coachDay':'coachHour')} · ${t('coachApprox')} ${formatted(points,points<1?1:0)} ${t(unit==='day'?'coachPerDay':'coachPerHour')}`;
    }else{$('coach-comparison').textContent='';$('coach-reference').textContent='';}
    $('coach-reset').hidden=!Number.isFinite(reset);$('coach-reset').textContent=Number.isFinite(reset)?`${t('reset')} ${time(new Date(reset).toISOString())}`:'';
  }
  function render(value){
    const data=value?.schemaVersion===1?value:null;
    renderPace(data);
    for(const kind of ['session','weekly']){
      const root=$(kind),q=data?.quotas?.find(item=>item.kind===kind),reset=q?.resetsAt?Date.parse(q.resetsAt):NaN,expired=Number.isFinite(reset)&&reset<=Date.now(),known=valid(q?.remainingPercent)&&q.remainingPercent<=100&&!expired;
      root.hidden=!q||(!valid(q.remainingPercent)&&!valid(q.windowMinutes)&&!Number.isFinite(reset));root.classList.toggle('outdated',readFailed||data?.quotaStale===true||!freshAt(data?.quotaUpdatedAt,Date.now()));
      const percent=known?Math.min(100,q.remainingPercent):null;
      root.querySelector('h2').textContent=windowName(q,kind);root.querySelector('.percent').textContent=known?formatted(percent,2):'—';root.querySelector('.unit').textContent=known?'%':'';
      root.classList.toggle('unknown',!known);root.classList.toggle('low',known&&percent<=15);root.querySelector('.remaining').textContent=t('remaining');root.querySelector('.reset').textContent=expired?t('expired'):Number.isFinite(reset)?`${t('reset')} ${time(q.resetsAt)}`:t('unknown');
      const track=root.querySelector('.track');track.setAttribute('aria-label',`${windowName(q,kind)} · ${t('remaining')}`);if(known){track.setAttribute('aria-valuenow',String(percent));track.removeAttribute('aria-valuetext');}else{track.removeAttribute('aria-valuenow');track.setAttribute('aria-valuetext',t('unknown'));}
      const fill=root.querySelector('.fill');fill.style.width=`${percent??0}%`;fill.style.setProperty('--scale',String(percent?100/percent:1));
    }
    document.querySelector('.official').hidden=['session','weekly'].every(kind=>$(kind).hidden);
    $('today-label').textContent=t('today');$('tokens').textContent=valid(data?.today?.totalTokens)?new Intl.NumberFormat(locale,{maximumFractionDigits:0}).format(data.today.totalTokens):'—';$('cost').textContent=valid(data?.today?.costUSD)?new Intl.NumberFormat(locale,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:4}).format(data.today.costUSD):'—';
    $('updated').textContent=`${t('quotaTime')} ${time(data?.quotaUpdatedAt)} · ${t('todayTime')} ${time(data?.today?.updatedAt)}`;
    if(connected)status(!data||!data.capturedAt?'waiting':data.quotaStale||data.today?.stale?'stale':'ready');
  }
  function result(value,ignoreUnrelated=false){if(value?.isError)throw new Error('tool');const data=value?.structuredContent;if(data?.schemaVersion!==1||!Array.isArray(data.quotas)||!data.today||typeof data.today!=='object'){if(ignoreUnrelated)return;throw new Error('snapshot');}readFailed=false;snapshot=data;render(snapshot);}
  async function refresh(){if(!connected||loading)return;loading=true;$('refresh').disabled=true;try{result(await send('tools/call',{name:'pulse_usage',arguments:{}}));}catch(error){readFailed=true;render(snapshot);status(error.message==='timeout'?'timeout':'failed',true);}finally{loading=false;$('refresh').disabled=!connected;}}
  async function open(target,button){button.disabled=true;try{const response=await send('tools/call',{name:'pulse_open',arguments:{target}});if(response?.isError)throw new Error('tool');status(target==='main'?'requested':'requestedWidget');}catch{status('failed',true);}finally{button.disabled=!connected;}}
  window.addEventListener('message',event=>{
    const message=event.data;if(event.source!==parent||!message||message.jsonrpc!=='2.0')return;
    if(!message.method&&Object.hasOwn(message,'id')&&(Object.hasOwn(message,'result')||Object.hasOwn(message,'error'))&&pending.has(message.id)){const request=pending.get(message.id);pending.delete(message.id);clearTimeout(request.timer);message.error?request.reject(new Error('rpc')):request.resolve(message.result);}
    else if(message.method==='ui/notifications/tool-result'){try{result(message.params,true);}catch{readFailed=true;render(snapshot);status('failed',true);}}
    else if(message.method==='ui/notifications/host-context-changed')context(message.params);
    else if(message.method==='ping'&&Object.hasOwn(message,'id'))parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
  });
  document.querySelectorAll('[data-style-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('main').dataset.style=button.dataset.styleChoice;document.querySelectorAll('[data-style-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));try{localStorage.setItem('pulse-panel-style',button.dataset.styleChoice);}catch{}}));
  try{const style=localStorage.getItem('pulse-panel-style');if(style==='meter')document.querySelector('[data-style-choice=meter]').click();}catch{}
  $('refresh').addEventListener('click',refresh);$('open').addEventListener('click',()=>open('main',$('open')));$('widget').addEventListener('click',()=>open('widget',$('widget')));
  translate();status('connecting');
  if(parent===window){status('unavailable',true);return;}
  send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Codex Pulse',version:'__PULSE_VERSION__'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}}).then(response=>{connected=true;context(response?.hostContext);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');for(const id of ['refresh','open','widget'])$(id).disabled=false;refresh();}).catch(()=>status('timeout',true));
  setInterval(()=>{if(!document.hidden){renderPace(snapshot);refresh();}},60000);
})();
</script></body></html>
