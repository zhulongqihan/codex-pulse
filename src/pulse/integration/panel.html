<header><div class="brand"><img src="__PULSE_ICON__" width="28" height="28" alt="">Codex Pulse</div><div class="styles" role="group" aria-label="外观"><button data-style-choice="follow" aria-pressed="true">跟随 Pulse</button><button data-style-choice="clear" aria-pressed="false">清爽</button><button data-style-choice="meter" aria-pressed="false">刻度</button></div></header>
<h1 data-i18n="heading">看见额度，也看见节奏</h1><p class="intro" data-i18n="intro">基于近期官方读数，查看使用节奏与触顶风险。</p>

<p class="official" data-i18n="official">官方额度 · 作为参考</p>
<section class="quota unknown" id="session"><div class="quota-top"><h2>当前额度窗口</h2><div class="reading"><span class="percent">—</span><small class="unit"></small></div></div><div class="track" role="meter" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="quota-meta"><span class="remaining">剩余</span><span class="reset">等待额度数据</span></div></section>
<section class="quota unknown" id="weekly"><div class="quota-top"><h2>另一额度窗口</h2><div class="reading"><span class="percent">—</span><small class="unit"></small></div></div><div class="track" role="meter" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="quota-meta"><span class="remaining">剩余</span><span class="reset">等待额度数据</span></div></section>
<section class="today"><p class="eyebrow" id="today-label">今天</p><div class="stats"><dl><dt data-i18n="tokens">Tokens</dt><dd id="tokens">—</dd></dl><dl><dt data-i18n="cost">API 参考估价</dt><dd id="cost">—</dd></dl></div><p class="estimate" data-i18n="estimate">估价不代表订阅账单或实际收费。</p><p class="time" id="updated">等待本机数据</p></section>
<section class="companion-context" id="notice-section"><h2 data-i18n="noticeTitle">重置预告</h2><p id="notice-empty" data-i18n="noticeNone"></p><div id="notice-content" hidden><p class="context-class" data-i18n="noticeClass"></p><p id="notice-summary"></p><p id="notice-time"></p><a id="notice-source" target="_blank" rel="noopener noreferrer"></a><p class="context-note" data-i18n="noticeScope"></p></div></section>

<p class="foot" data-i18n="followNote"></p><p class="context-note" id="presentation-fallback"></p>
<p class="state" id="status" role="status" aria-live="polite">正在连接客户端…</p><div class="actions"><button class="primary" id="open" disabled data-i18n="open">打开 Pulse</button><button id="widget" disabled data-i18n="widget">显示浮窗</button><button id="details-button" disabled data-i18n="details">打开观测详情</button><button id="refresh" disabled data-i18n="refresh">刷新</button></div><p class="foot" data-i18n="foot">每分钟读取 Pulse 本地快照。请保持 Pulse 运行，以获得更新。</p>

    const rows=matching&&Array.isArray(coach?.dailyObservations)?coach.dailyObservations.filter(row=>/^\d{4}-\d{2}-\d{2}$/.test(row.date)&&valid(row.coveredMinutes)&&row.coveredMinutes<=1500).slice(0,7):[];
    $('observation-list').replaceChildren();for(const row of rows){const li=document.createElement('li'),values=document.createElement('div'),date=document.createElement('span'),points=document.createElement('strong'),coverage=document.createElement('span');values.className='observation-values';date.textContent=row.date;points.textContent=valid(row.consumedPercentPoints)?t('points').replace('{points}',formatted(row.consumedPercentPoints,1)):t('unobserved');values.append(date,points);coverage.className='observation-coverage';coverage.textContent=t('coverage').replace('{minutes}',formatted(row.coveredMinutes))+(row.partial?' · '+t('partial'):'');li.append(values,coverage);$('observation-list').append(li)}
    $('no-daily').hidden=rows.length>0;$('observation-zone').hidden=!matching||!coach?.observationTimezone;$('observation-zone').textContent=matching&&typeof coach?.observationTimezone==='string'?t('observationZone')+': '+coach.observationTimezone:'';
  }
  function render(value){
    const data=value?.schemaVersion===1?value:null;
    applyPresentation(data);renderPace(data);renderCoach(data);
    for(const kind of ['session','weekly']){
      const root=$(kind),q=data?.quotas?.find(item=>item.kind===kind),reset=q?.resetsAt?Date.parse(q.resetsAt):NaN,expired=Number.isFinite(reset)&&reset<=Date.now(),known=valid(q?.remainingPercent)&&q.remainingPercent<=100&&!expired;
      root.hidden=!q||(!valid(q.remainingPercent)&&!valid(q.windowMinutes)&&!Number.isFinite(reset));root.classList.toggle('outdated',readFailed||data?.quotaStale===true||!freshAt(data?.quotaUpdatedAt,Date.now()));
      const percent=known?Math.min(100,q.remainingPercent):null;
      root.querySelector('h2').textContent=windowName(q,kind);root.querySelector('.percent').textContent=known?formatted(percent,2):'—';root.querySelector('.unit').textContent=known?'%':'';
      root.classList.toggle('unknown',!known);root.classList.toggle('low',known&&percent<=15);root.querySelector('.remaining').textContent=t('remaining');root.querySelector('.reset').textContent=expired?t('expired'):Number.isFinite(reset)?`${t('reset')} ${time(q.resetsAt)}`:t('unknown');
      const track=root.querySelector('.track');track.setAttribute('aria-label',`${windowName(q,kind)} · ${t('remaining')}`);if(known){track.setAttribute('aria-valuenow',String(percent));track.removeAttribute('aria-valuetext');}else{track.removeAttribute('aria-valuenow');track.setAttribute('aria-valuetext',t('unknown'));}
      const fill=root.querySelector('.fill');fill.style.width=`${percent??0}%`;fill.style.setProperty('--scale',String(percent?100/percent:1));
    }
    document.querySelector('.official').hidden=['session','weekly'].every(kind=>$(kind).hidden);
    $('today-label').textContent=t('today');$('tokens').textContent=valid(data?.today?.totalTokens)?new Intl.NumberFormat(locale,{maximumFractionDigits:0}).format(data.today.totalTokens):'—';$('cost').textContent=valid(data?.today?.costUSD)?new Intl.NumberFormat(locale,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:4}).format(data.today.costUSD):'—';
    $('updated').textContent=`${t('quotaTime')} ${time(data?.quotaUpdatedAt)} · ${t('todayTime')} ${time(data?.today?.updatedAt)}`;
    if(connected){if(readFailed)status('failed',true);else status(!data||!data.capturedAt?'waiting':data.quotaStale||data.today?.stale?'stale':'ready');}
  }
  function result(value,ignoreUnrelated=false){if(value?.isError)throw new Error('tool');const data=value?.structuredContent;if(data?.schemaVersion!==1||!Array.isArray(data.quotas)||!data.today||typeof data.today!=='object'){if(ignoreUnrelated)return;throw new Error('snapshot');}readFailed=false;snapshot=data;render(snapshot);}
  async function refresh(){if(!connected||loading)return;loading=true;$('refresh').disabled=true;try{result(await send('tools/call',{name:'pulse_usage',arguments:{}}));}catch(error){readFailed=true;render(snapshot);status(error.message==='timeout'?'timeout':'failed',true);}finally{loading=false;$('refresh').disabled=!connected;}}
  async function open(target,button){button.disabled=true;try{const response=await send('tools/call',{name:'pulse_open',arguments:{target}});if(response?.isError)throw new Error('tool');status(target==='main'?'requested':target==='details'?'requestedDetails':'requestedWidget');}catch{status('failed',true);}finally{button.disabled=!connected;}}
  window.addEventListener('message',event=>{
    const message=event.data;if(event.source!==parent||!message||message.jsonrpc!=='2.0')return;
    if(!message.method&&Object.hasOwn(message,'id')&&(Object.hasOwn(message,'result')||Object.hasOwn(message,'error'))&&pending.has(message.id)){const request=pending.get(message.id);pending.delete(message.id);clearTimeout(request.timer);message.error?request.reject(new Error('rpc')):request.resolve(message.result);}
    else if(message.method==='ui/notifications/tool-result'){try{result(message.params,true);}catch{readFailed=true;render(snapshot);status('failed',true);}}
    else if(message.method==='ui/notifications/host-context-changed')context(message.params);
    else if(message.method==='ping'&&Object.hasOwn(message,'id'))parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
  });
  document.querySelectorAll('[data-style-choice]').forEach(button=>button.addEventListener('click',()=>{styleChoice=button.dataset.styleChoice;applyPresentation(snapshot);try{if(styleChoice==='follow')localStorage.removeItem('pulse-panel-style');else localStorage.setItem('pulse-panel-style',styleChoice);}catch{}}));
  try{const style=localStorage.getItem('pulse-panel-style');if(style==='clear'||style==='meter')styleChoice=style;}catch{}
  $('refresh').addEventListener('click',refresh);$('open').addEventListener('click',()=>open('main',$('open')));$('widget').addEventListener('click',()=>open('widget',$('widget')));
  $('details-button').addEventListener('click',()=>open('details',$('details-button')));
  translate();status('connecting');
  if(parent===window){status('unavailable',true);return;}
  send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Codex Pulse',version:'__PULSE_VERSION__'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}}).then(response=>{connected=true;context(response?.hostContext);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');for(const id of ['refresh','open','widget','details-button'])$(id).disabled=false;refresh();}).catch(()=>status('timeout',true));
  setInterval(()=>{if(!document.hidden){render(snapshot);refresh();}},60000);
})();
</script></body></html>
