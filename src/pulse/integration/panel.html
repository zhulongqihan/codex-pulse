<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Pulse</title>
<style>
:root{color-scheme:light dark;--bg:#f8faf9;--surface:#fff;--ink:#202b27;--muted:#66746d;--line:#dde5df;--accent:#247a56;--soft:#e9f3ed;--warn:#986022;font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
:root[data-theme=dark]{--bg:#171c19;--surface:#202723;--ink:#e6eee8;--muted:#a6b5ab;--line:#37463b;--accent:#89cda4;--soft:#293d30;--warn:#e2bb80}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171c19;--surface:#202723;--ink:#e6eee8;--muted:#a6b5ab;--line:#37463b;--accent:#89cda4;--soft:#293d30;--warn:#e2bb80}}
*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:20px}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:36px;padding:6px 12px}button:hover{border-color:var(--accent);color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.55;cursor:wait}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px}.brand svg{color:var(--accent)}.styles{display:flex;gap:2px;border:1px solid var(--line);padding:2px;border-radius:8px}.styles button{border:0;background:transparent;min-height:28px;font-size:12px;padding:4px 9px}.styles [aria-pressed=true]{background:var(--soft);color:var(--accent)}h1{margin:0;font-size:24px;font-weight:620;letter-spacing:-.5px}.intro{margin:5px 0 20px;color:var(--muted);font-size:13px}.quota{padding:18px 0;border-top:1px solid var(--line)}.quota-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.quota h2{font-size:14px;font-weight:550;margin:0}.reading{font-size:30px;line-height:1.25;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}.reading small{font-size:16px;letter-spacing:0;font-weight:450;margin-left:2px}.track{height:7px;background:var(--line);border-radius:6px;margin:12px 0 9px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:6px}.quota-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.unknown .fill{width:0!important}.low .fill{background:var(--warn)}.today{border-top:1px solid var(--line);padding-top:20px;margin-top:2px}.eyebrow{margin:0 0 10px;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}dl{margin:0}dt{color:var(--muted);font-size:12px}dd{font-size:23px;font-weight:580;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:3px 0}.estimate{font-size:11px;color:var(--muted);margin:4px 0 0}.time{font-size:12px;color:var(--muted);margin:15px 0 0}.state{font-size:12px;min-height:18px;color:var(--muted);margin:8px 0 18px}.state[data-error=true]{color:var(--warn)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}.primary:hover{color:var(--surface);filter:brightness(.93)}#refresh{margin-left:auto}.foot{color:var(--muted);font-size:11px;line-height:1.6;margin:16px 0 0}
[data-style=meter] .quota{padding:16px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px;border-radius:10px}[data-style=meter] .track{height:11px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) calc(10% - 2px),transparent calc(10% - 2px),transparent 10%)}[data-style=meter] .fill{border-radius:2px;mask-image:repeating-linear-gradient(90deg,#000 0,#000 calc(10% - 2px),transparent calc(10% - 2px),transparent 10%);mask-size:calc(100% * var(--scale,1)) 100%}[data-style=meter] .reading{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:29px}[data-style=meter] .today{margin-top:22px}
@media(max-width:350px){main{padding:16px}header{margin-bottom:20px}.actions button{flex:1;white-space:nowrap}#refresh{margin-left:0}.reading{font-size:27px}.quota-meta{display:block}.quota-meta span{display:block}}@media(prefers-reduced-motion:no-preference){.fill{transition:width .2s ease}}
.brand img{display:block;border-radius:6px}.pace{margin:0 0 22px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.pace-label{margin:0 0 7px;color:var(--muted);font-size:12px}.pace-reading{font-size:32px;font-weight:650;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.3}.pace-risk{margin:6px 0;color:var(--ink);font-size:13px}.pace-note{margin:7px 0 0;color:var(--muted);font-size:11px}.official{margin:0;color:var(--muted);font-size:12px}.quota .reading{font-size:24px}[data-style=meter] .pace{border-radius:4px}[data-style=meter] .pace-reading{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
</style></head><body><main data-style="clear">
<header><div class="brand"><img src="__PULSE_ICON__" width="28" height="28" alt="">Codex Pulse</div><div class="styles" aria-label="外观"><button data-style-choice="clear" aria-pressed="true">清爽</button><button data-style-choice="meter" aria-pressed="false">刻度</button></div></header>
<h1 data-i18n="heading">看见额度，也看见节奏</h1><p class="intro" data-i18n="intro">基于近期官方读数，查看使用节奏与触顶风险。</p>
<section class="pace" aria-live="polite"><p class="pace-label" data-i18n="paceLabel">预计触顶区间</p><div class="pace-reading" id="pace-reading">正在采样</div><p class="pace-risk" id="pace-risk"></p><p class="pace-note" data-i18n="paceNote">需至少 15 分钟连续读数；估算仅针对此窗口，其他额度仍可能限制使用，不代表可工作时长。</p></section>
<p class="official" data-i18n="official">官方额度 · 作为参考</p>
<section class="quota unknown" id="session"><div class="quota-top"><h2>当前额度窗口</h2><div class="reading"><span class="percent">—</span><small class="unit"></small></div></div><div class="track" role="meter" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="quota-meta"><span class="remaining">剩余</span><span class="reset">等待额度数据</span></div></section>
<section class="quota unknown" id="weekly"><div class="quota-top"><h2>另一额度窗口</h2><div class="reading"><span class="percent">—</span><small class="unit"></small></div></div><div class="track" role="meter" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="quota-meta"><span class="remaining">剩余</span><span class="reset">等待额度数据</span></div></section>
<section class="today"><p class="eyebrow" id="today-label">今天</p><div class="stats"><dl><dt data-i18n="tokens">Tokens</dt><dd id="tokens">—</dd></dl><dl><dt data-i18n="cost">API 参考估价</dt><dd id="cost">—</dd></dl></div><p class="estimate" data-i18n="estimate">估价不代表订阅账单或实际收费。</p><p class="time" id="updated">等待本机数据</p></section>
<p class="state" id="status" role="status" aria-live="polite">正在连接客户端…</p><div class="actions"><button class="primary" id="open" disabled data-i18n="open">打开 Pulse</button><button id="widget" disabled data-i18n="widget">显示浮窗</button><button id="refresh" disabled data-i18n="refresh">刷新</button></div><p class="foot" data-i18n="foot">每分钟读取 Pulse 本地快照。请保持 Pulse 运行，以获得更新。</p>
</main><script>
(() => {
  'use strict';
  const strings = {
    zh:{heading:'额度，一眼可见',intro:'留在当前对话，查看本机最近读数。',clear:'清爽',meter:'刻度',tokens:'Tokens',cost:'API 参考估价',estimate:'估价不代表订阅账单或实际收费。',open:'打开 Pulse',widget:'显示浮窗',refresh:'刷新',foot:'每分钟读取 Pulse 本地快照。请保持 Pulse 运行，以获得更新。',today:'今天',remaining:'剩余',session:'当前额度窗口',weekly:'另一额度窗口',hours:'小时窗口',days:'天窗口',minutes:'分钟窗口',unknown:'等待额度数据',reset:'重置',expired:'窗口已到期，等待读数',quotaTime:'额度更新',todayTime:'今日更新',never:'暂无读数',connecting:'正在连接客户端…',ready:'已连接 · 读取本地快照',waiting:'尚无本机快照，请先打开 Pulse。',stale:'显示最近快照 · 部分数据待更新',failed:'暂时无法读取，请重试或打开 Pulse。',timeout:'客户端未响应，请重新打开面板。',requested:'已请求打开 Pulse',requestedWidget:'已请求显示浮窗',unavailable:'请从 Codex 插件入口打开此面板。'},
    en:{heading:'Your quota at a glance',intro:'Keep your conversation in view. Check the latest local readings.',clear:'Clear',meter:'Meter',tokens:'Tokens',cost:'API cost estimate',estimate:'Estimates are not your subscription bill or actual charges.',open:'Open Pulse',widget:'Show widget',refresh:'Refresh',foot:'Reads the local Pulse snapshot every minute. Keep Pulse running for updates.',today:'Today',remaining:'Remaining',session:'Current quota window',weekly:'Other quota window',hours:'hour window',days:'day window',minutes:'minute window',unknown:'Waiting for quota data',reset:'Resets',expired:'Window ended · awaiting a reading',quotaTime:'Quota updated',todayTime:'Today updated',never:'No reading yet',connecting:'Connecting to the client…',ready:'Connected · local snapshot',waiting:'No local snapshot yet. Open Pulse to get started.',stale:'Latest snapshot · some readings need an update',failed:'Could not read data. Retry or open Pulse.',timeout:'The client did not respond. Reopen this panel.',requested:'Requested to open Pulse',requestedWidget:'Requested to show the widget',unavailable:'Open this panel from the Codex plugin entry.'}
  };
  Object.assign(strings.zh,{heading:'看见额度，也看见节奏',intro:'基于近期官方读数，查看使用节奏与触顶风险。',paceLabel:'预计触顶区间',paceNote:'需至少 15 分钟连续读数；估算会随使用变化，不代表可工作时长。',official:'官方额度 · 作为参考',unavailablePace:'等待读数',sampling:'正在采样',stalePace:'读数待更新',expiredPace:'等待重置后读数',idle:'近期无明显消耗',slow:'近期变化不足',exhausted:'额度已用尽',before_reset:'可能早于重置触顶',near_reset:'可能接近重置时触顶',after_reset:'按近期节奏，预计重置先到',unknownRisk:'尚无可靠触顶估算',paceUpdated:'节奏更新'});
  Object.assign(strings.en,{heading:'See your quota. Know your pace.',intro:'Recent official readings reveal usage pace and the risk of reaching your limit.',paceLabel:'Estimated time to limit',paceNote:'Needs at least 15 minutes of continuous readings. An estimate, not guaranteed working time.',official:'Official quota · reference',unavailablePace:'Awaiting readings',sampling:'Sampling',stalePace:'Update needed',expiredPace:'Awaiting reset reading',idle:'No recent measurable use',slow:'Insufficient change',exhausted:'Quota exhausted',before_reset:'May reach the limit before reset',near_reset:'May reach the limit near reset',after_reset:'At this pace, reset is estimated to come first',unknownRisk:'No reliable estimate yet',paceUpdated:'Pace updated'});
  strings.zh.paceNote='需至少 15 分钟连续读数；估算仅针对此窗口，其他额度仍可能限制使用，不代表可工作时长。';
  strings.en.paceNote='Needs 15+ minutes of readings. Applies to this window; other limits may apply. Not guaranteed working time.';
  let locale = /^zh\b/i.test(navigator.language) ? 'zh' : 'en';
  let connected=false, nextId=1, snapshot=null, loading=false, readFailed=false;
  const pending=new Map(), $=id=>document.getElementById(id), t=key=>strings[locale][key];
  function status(key,error=false){$('status').textContent=t(key);$('status').dataset.error=String(error);}
  function translate(){document.documentElement.lang=locale==='zh'?'zh-CN':'en';document.querySelector('.styles').setAttribute('aria-label',locale==='zh'?'外观':'Appearance');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-style-choice]').forEach(el=>el.textContent=t(el.dataset.styleChoice));render(snapshot);}
  function context(value){if(value?.theme==='light'||value?.theme==='dark')document.documentElement.dataset.theme=value.theme;if(typeof value?.locale==='string'){locale=/^zh\b/i.test(value.locale)?'zh':'en';translate();}}
  function send(method,params){return new Promise((resolve,reject)=>{const id=nextId++;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'));},12000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
  function valid(value){return typeof value==='number'&&Number.isFinite(value)&&value>=0;}
  function time(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?d.toLocaleString(locale==='zh'?'zh-CN':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):t('never');}
  function windowName(quota,kind){const minutes=quota?.windowMinutes;if(!valid(minutes)||minutes<=0)return t(kind);if(minutes%1440===0)return `${minutes/1440} ${t('days')}`;if(minutes%60===0)return `${minutes/60} ${t('hours')}`;return `${minutes} ${t('minutes')}`;}
  function renderPace(data){
    const pace=data?.pace?.schemaVersion===1?data.pace:null,window=pace?.windows?.find(item=>item.kind===pace.primaryKind);
    const fresh=pace?.updatedAt&&Date.now()-Date.parse(pace.updatedAt)<=360000&&Date.parse(pace.updatedAt)-Date.now()<=120000;
    let state=pace?.status??'unavailable';if((!fresh||readFailed)&&state!=='unavailable'&&state!=='expired')state='stale';
    const estimate=state==='forecast'&&window?.state==='forecast'&&valid(window.etaLowerMinutes)&&valid(window.etaUpperMinutes)&&window.etaUpperMinutes>=window.etaLowerMinutes;
    if(estimate){const hours=window.etaLowerMinutes>=60,lower=hours?Math.floor(window.etaLowerMinutes/60):Math.floor(window.etaLowerMinutes/5)*5,upper=hours?Math.ceil(window.etaUpperMinutes/60):Math.max(5,Math.ceil(window.etaUpperMinutes/5)*5);$('pace-reading').textContent=`≈${lower===upper?lower:`${lower}–${upper}`}${hours?'h':'m'}`;}
    else $('pace-reading').textContent=t(({unavailable:'unavailablePace',stale:'stalePace',expired:'expiredPace',forecast:'sampling'})[state]??(['sampling','idle','slow','exhausted'].includes(state)?state:'unavailablePace'));
    const risk=estimate&&['before_reset','near_reset','after_reset'].includes(window.risk)?t(window.risk):t('unknownRisk');
    $('pace-risk').textContent=window?`${windowName(window,window.kind)} · ${risk}`:risk;
  }
  function render(value){
    const data=value?.schemaVersion===1?value:null;
    renderPace(data);
    for(const kind of ['session','weekly']){
      const root=$(kind),q=data?.quotas?.find(item=>item.kind===kind),reset=q?.resetsAt?Date.parse(q.resetsAt):NaN,expired=Number.isFinite(reset)&&reset<=Date.now(),known=valid(q?.remainingPercent)&&!expired;
      const percent=known?Math.min(100,q.remainingPercent):null;
      root.querySelector('h2').textContent=windowName(q,kind);root.querySelector('.percent').textContent=known?new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(percent):'—';root.querySelector('.unit').textContent=known?'%':'';
      root.classList.toggle('unknown',!known);root.classList.toggle('low',known&&percent<=15);root.querySelector('.remaining').textContent=t('remaining');root.querySelector('.reset').textContent=expired?t('expired'):Number.isFinite(reset)?`${t('reset')} ${time(q.resetsAt)}`:t('unknown');
      const track=root.querySelector('.track');track.setAttribute('aria-label',`${windowName(q,kind)} · ${t('remaining')}`);if(known){track.setAttribute('aria-valuenow',String(percent));track.removeAttribute('aria-valuetext');}else{track.removeAttribute('aria-valuenow');track.setAttribute('aria-valuetext',t('unknown'));}
      const fill=root.querySelector('.fill');fill.style.width=`${percent??0}%`;fill.style.setProperty('--scale',String(percent?100/percent:1));
    }
    $('today-label').textContent=t('today');$('tokens').textContent=valid(data?.today?.totalTokens)?new Intl.NumberFormat(locale,{maximumFractionDigits:0}).format(data.today.totalTokens):'—';$('cost').textContent=valid(data?.today?.costUSD)?new Intl.NumberFormat(locale,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:4}).format(data.today.costUSD):'—';
    $('updated').textContent=`${t('quotaTime')} ${time(data?.quotaUpdatedAt)} · ${t('todayTime')} ${time(data?.today?.updatedAt)}`;
    if(connected)status(!data||!data.capturedAt?'waiting':data.quotaStale||data.today?.stale?'stale':'ready');
  }
  function result(value,ignoreUnrelated=false){if(value?.isError)throw new Error('tool');const data=value?.structuredContent;if(data?.schemaVersion!==1||!Array.isArray(data.quotas)||!data.today||typeof data.today!=='object'){if(ignoreUnrelated)return;throw new Error('snapshot');}readFailed=false;snapshot=data;render(snapshot);}
  async function refresh(){if(!connected||loading)return;loading=true;$('refresh').disabled=true;try{result(await send('tools/call',{name:'pulse_usage',arguments:{}}));}catch(error){readFailed=true;renderPace(snapshot);status(error.message==='timeout'?'timeout':'failed',true);}finally{loading=false;$('refresh').disabled=!connected;}}
  async function open(target,button){button.disabled=true;try{const response=await send('tools/call',{name:'pulse_open',arguments:{target}});if(response?.isError)throw new Error('tool');status(target==='main'?'requested':'requestedWidget');}catch{status('failed',true);}finally{button.disabled=!connected;}}
  window.addEventListener('message',event=>{
    const message=event.data;if(event.source!==parent||!message||message.jsonrpc!=='2.0')return;
    if(!message.method&&Object.hasOwn(message,'id')&&(Object.hasOwn(message,'result')||Object.hasOwn(message,'error'))&&pending.has(message.id)){const request=pending.get(message.id);pending.delete(message.id);clearTimeout(request.timer);message.error?request.reject(new Error('rpc')):request.resolve(message.result);}
    else if(message.method==='ui/notifications/tool-result'){try{result(message.params,true);}catch{readFailed=true;renderPace(snapshot);status('failed',true);}}
    else if(message.method==='ui/notifications/host-context-changed')context(message.params);
    else if(message.method==='ping'&&Object.hasOwn(message,'id'))parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
  });
  document.querySelectorAll('[data-style-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('main').dataset.style=button.dataset.styleChoice;document.querySelectorAll('[data-style-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));try{localStorage.setItem('pulse-panel-style',button.dataset.styleChoice);}catch{}}));
  try{const style=localStorage.getItem('pulse-panel-style');if(style==='meter')document.querySelector('[data-style-choice=meter]').click();}catch{}
  $('refresh').addEventListener('click',refresh);$('open').addEventListener('click',()=>open('main',$('open')));$('widget').addEventListener('click',()=>open('widget',$('widget')));
  translate();status('connecting');
  if(parent===window){status('unavailable',true);return;}
  send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Codex Pulse',version:'__PULSE_VERSION__'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}}).then(response=>{connected=true;context(response?.hostContext);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');for(const id of ['refresh','open','widget'])$(id).disabled=false;refresh();}).catch(()=>status('timeout',true));
  setInterval(()=>{if(!document.hidden){renderPace(snapshot);refresh();}},60000);
})();
</script></body></html>
