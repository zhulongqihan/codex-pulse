  function formatted(value,digits=0){const f=new Intl.NumberFormat(locale,{maximumFractionDigits:digits});return value>0&&value<.5*10**-digits?`<${f.format(10**-digits)}`:f.format(value);}
  function time(value){const d=new Date(value);return value&&Number.isFinite(d.getTime())?d.toLocaleString(locale,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):t('never');}
  function windowName(quota,kind){const minutes=quota?.windowMinutes;if(!valid(minutes)||minutes<=0)return t(kind);if(minutes%1440===0)return `${minutes/1440} ${t('days')}`;if(minutes%60===0)return `${minutes/60} ${t('hours')}`;return `${minutes} ${t('minutes')}`;}
  function at(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(value)?Date.parse(value):NaN;}
  function freshAt(value,now){const stamp=at(value);return Number.isFinite(stamp)&&now-stamp>=-120000&&now-stamp<=360000;}
  function countdown(minutes){if(!valid(minutes))return '—';if(minutes<=0)return t('expired');const total=Math.ceil(minutes),days=Math.floor(total/1440),hours=Math.floor(total%1440/60);return days?`${days}${t('coachDays')} ${hours}${t('coachHours')}`:hours?`${hours}${t('coachHours')} ${total%60}${t('coachMinutes')}`:`${total}${t('coachMinutes')}`;}
  function renderPace(data){
    const now=Date.now(),pace=data?.pace?.schemaVersion===1?data.pace:null;
    const windows=Array.isArray(pace?.windows)?pace.windows:!pace&&Array.isArray(data?.quotas)?data.quotas.map(item=>({...item,state:'sampling'})):[];

    const candidates=windows.flatMap(window=>{const duration=window.windowMinutes,reset=at(window.resetsAt),remaining=window.remainingPercent,minutes=(reset-now)/60000;
      if(!['session','weekly'].includes(window.kind)||!valid(remaining)||remaining>100||!valid(duration)||duration<=0||duration>5256000||!Number.isFinite(reset)||minutes<=0||minutes>duration+2||['unavailable','stale','expired'].includes(window.state))return [];

    const remaining=state==='expired'?null:chosen?.remaining??(known?known.remainingPercent:null),reset=chosen?.reset??at(window?.resetsAt);
    const tone=state==='ready'?100-chosen.remaining-(100-chosen.timeLeft)>5?'fast':100-chosen.remaining-(100-chosen.timeLeft)<-5?'roomy':'balanced':null;
    const recent=chosen?.window;
    const recentRisk=state==='ready'&&tone!=='fast'&&recent?.state==='forecast'&&valid(recent.sampleCount)&&recent.sampleCount>=4&&valid(recent.sampleSpanMinutes)&&recent.sampleSpanMinutes>=15&&valid(recent.rateLowerPerHour)&&recent.rateLowerPerHour>0&&valid(recent.rateUpperPerHour)&&recent.rateUpperPerHour>=recent.rateLowerPerHour&&freshAt(recent.trend?.at(-1)?.at,now)&&chosen.remaining-recent.rateLowerPerHour*chosen.minutes/60<1;
    const card=document.querySelector('.pace');card.dataset.state=state;card.dataset.tone=recentRisk?'fast':tone??'';
    $('coach-window').textContent=window?`${t('coachTitle')} · ${windowName(window,window.kind)}`:t('coachTitle');
    $('coach-quota-label').textContent=['stale','failed','expired'].includes(state)?t('coachLast'):t('coachRemaining');
    $('pace-reading').textContent=remaining==null?'—':`${formatted(remaining,2)}%`;
    $('coach-time').textContent=Number.isFinite(reset)&&reset>now?countdown((reset-now)/60000):'—';
    $('pace-risk').textContent=recentRisk?t('coachRecentFast'):t(tone?({roomy:'coachRoomy',balanced:'coachBalanced',fast:'coachFast'})[tone]:({unavailable:'coachUnavailable',stale:'coachStale',failed:'coachFailed',exhausted:'coachExhausted',expired:'coachExpired'})[state]);
    const reasonKey={login_required:'loginRequired',api_key:'apiKeyReason',offline:'offlineReason',identity_unavailable:'identityReason',no_observations:'noObservations',invalid_observation_time:'invalidTime'}[pace?.reason];
    if(state!=='ready'&&reasonKey)$('pace-risk').textContent+=` · ${t(reasonKey)}`;
    $('coach-missing').hidden=state!=='ready'||['session','weekly'].every(kind=>candidates.some(item=>item.window.kind===kind));$('coach-missing').textContent=t('missingWindow');
    $('coach-comparison').hidden=state!=='ready';$('coach-reference').hidden=state!=='ready';
    if(state==='ready'){
      const n=value=>formatted(value),unit=chosen.minutes<60?'reset':chosen.window.windowMinutes>=1440&&chosen.minutes>=1440?'day':'hour',points=unit==='reset'?chosen.remaining:chosen.remaining/(chosen.minutes/(unit==='day'?1440:60));
      $('coach-comparison').textContent=`${t('coachUsed')} ${n(100-chosen.remaining)}% · ${t('coachElapsed')} ${n(100-chosen.timeLeft)}%`;
      $('coach-reference').textContent=unit==='reset'?`${t('coachUntil')} · ${formatted(points,1)}%`:`${t(unit==='day'?'coachDay':'coachHour')} · ${t(unit==='day'?'coachPerDay':'coachPerHour').replace('{points}',formatted(points,points<1?1:0))}`;
    }else{$('coach-comparison').textContent='';$('coach-reference').textContent='';}
    $('coach-reset').hidden=!Number.isFinite(reset);$('coach-reset').textContent=Number.isFinite(reset)?`${t('reset')} ${time(new Date(reset).toISOString())}`:'';
  }
  function noticeUrl(value){if(typeof value!=='string'||value.length>1024)return null;try{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||u.port||!['x.com','www.x.com','twitter.com','www.twitter.com','openai.com','www.openai.com'].includes(u.hostname))return null;u.search='';u.hash='';return u.href}catch{return null}}
  function renderCoach(data){
    const now=Date.now(),coach=data?.coach,notice=coach?.resetNotice,url=noticeUrl(notice?.sourceUrl),updated=at(notice?.updatedAt),published=at(notice?.publishedAt),end=notice?.endAt==null?null:at(notice.endAt),start=notice?.startAt==null?null:at(notice.startAt);
    const basis=notice?.verification==='third_party'&&notice?.scope==='global'&&url&&typeof notice.summary==='string'&&notice.summary.trim()&&notice.summary.length<=500&&Number.isFinite(updated)&&updated<=now+120000&&Number.isFinite(published)&&published<=now&&now-published<=7*86400000&&(end===null||Number.isFinite(end))&&(start===null||Number.isFinite(start)&&(end===null||start<=end));
    const noticeState=coach?.noticeState,knownStatus=['active','expired','stale','unavailable','none','unknown'].includes(noticeState?.status)?noticeState.status:'unknown',allowsActive=['active','unknown'].includes(knownStatus),checked=at(noticeState?.checkedAt),checkedValid=Number.isFinite(checked)&&checked<=now+120000,until=at(noticeState?.validUntil),rawUntil=basis?(Number.isFinite(end)?end:published+86400000):NaN,validUntil=allowsActive&&Number.isFinite(rawUntil)?rawUntil:Number.isFinite(until)?until:rawUntil;
    const usable=allowsActive&&!readFailed&&freshAt(data?.capturedAt,now)&&basis&&now-updated<=300000&&(end===null?now-published<86400000:end>now&&end-now<=7*86400000);
    let state=usable?'active':knownStatus;
    if(readFailed)state='unavailable';
    else if(!usable&&(knownStatus==='active'||knownStatus==='unknown'&&basis)){state=validUntil<=now?'expired':basis&&now-updated>300000||!freshAt(data?.capturedAt,now)?'stale':'unknown'}
    else if(knownStatus==='none')state=!checkedValid?'unknown':now-checked>300000||!freshAt(data?.capturedAt,now)?'stale':'none';
    else if(knownStatus==='unavailable'&&checkedValid&&now-checked>300000)state='stale';
    else if(knownStatus==='expired'&&!(validUntil<=now))state='unknown';
    const stateKey='noticeState'+state[0].toUpperCase()+state.slice(1);
    $('notice-content').hidden=!usable;$('notice-empty').hidden=!!usable;$('notice-state').hidden=!!usable;$('notice-scope').hidden=!usable;$('notice-section').dataset.noticeState=state;$('notice-empty').textContent=t(stateKey);$('notice-state-detail').textContent=t(stateKey+'Detail');
    $('notice-state-checked').hidden=!checkedValid;$('notice-state-checked').textContent=checkedValid?t('noticeStateChecked').replace('{time}',time(noticeState.checkedAt)):'';
    $('notice-state-until').hidden=!Number.isFinite(validUntil);$('notice-state-until').textContent=Number.isFinite(validUntil)?t('noticeStateValidUntil').replace('{time}',time(new Date(validUntil).toISOString())):'';
    $('notice-summary').textContent=usable?notice.summary:'';$('notice-time').textContent=usable?(end===null?t('noticeTimeUnknown'):(start===null?'':time(notice.startAt)+' – ')+time(notice.endAt)):'';
    if(usable){$('notice-source').href=url;$('notice-source').textContent=t('noticeSource').replace('{source}','codex-reset.com')}else{$('notice-source').removeAttribute('href');$('notice-source').textContent=''}
  }
  function render(value){
    const data=value?.schemaVersion===1?value:null;
    applyPresentation(data);renderPace(data);renderCoach(data);
    for(const kind of ['session','weekly']){
      const root=$(kind),q=data?.quotas?.find(item=>item.kind===kind),reset=q?.resetsAt?Date.parse(q.resetsAt):NaN,expired=Number.isFinite(reset)&&reset<=Date.now(),known=valid(q?.remainingPercent)&&q.remainingPercent<=100&&!expired;
      root.hidden=!q||(!valid(q.remainingPercent)&&!valid(q.windowMinutes)&&!Number.isFinite(reset));root.classList.toggle('outdated',readFailed||data?.quotaStale===true||!freshAt(data?.quotaUpdatedAt,Date.now()));
      const percent=known?Math.min(100,q.remainingPercent):null;
      root.querySelector('h2').textContent=windowName(q,kind);root.querySelector('.percent').textContent=known?formatted(percent,2):'—';root.querySelector('.unit').textContent=known?'%':'';
      root.classList.toggle('unknown',!known);root.classList.toggle('low',known&&percent<=15);root.querySelector('.remaining').textContent=t('remaining');root.querySelector('.reset').textContent=expired?t('expired'):Number.isFinite(reset)?`${t('reset')} ${time(q.resetsAt)}`:t('unknown');
      const track=root.querySelector('.track');track.setAttribute('aria-label',`${windowName(q,kind)} · ${t('remaining')}`);if(known){track.setAttribute('aria-valuenow',String(percent));track.removeAttribute('aria-valuetext');}else{track.removeAttribute('aria-valuenow');track.setAttribute('aria-valuetext',t('unknown'));}
      const fill=root.querySelector('.fill');fill.style.width=`${percent??0}%`;fill.style.setProperty('--scale',String(percent?100/percent:1));
    }
    document.querySelector('.official').hidden=['session','weekly'].every(kind=>$(kind).hidden);
    $('today-label').textContent=t('today');$('tokens').textContent=valid(data?.today?.totalTokens)?new Intl.NumberFormat(locale,{maximumFractionDigits:0}).format(data.today.totalTokens):'—';$('cost').textContent=valid(data?.today?.costUSD)?new Intl.NumberFormat(locale,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:4}).format(data.today.costUSD):'—';
    $('updated').textContent=`${t('quotaTime')} ${time(data?.quotaUpdatedAt)} · ${t('todayTime')} ${time(data?.today?.updatedAt)}`;
    if(connected){if(readFailed)status('failed',true);else status(!data||!data.capturedAt?'waiting':data.quotaStale||data.today?.stale?'stale':'ready');}
    positionInfo();
  }
  function result(value,ignoreUnrelated=false){if(value?.isError)throw new Error('tool');const data=value?.structuredContent;if(data?.schemaVersion!==1||!Array.isArray(data.quotas)||!data.today||typeof data.today!=='object'){if(ignoreUnrelated)return;throw new Error('snapshot');}readFailed=false;snapshot=data;render(snapshot);}
  async function refresh(){if(!connected||loading)return;loading=true;$('refresh').disabled=true;try{result(await send('tools/call',{name:'pulse_usage',arguments:{}}));}catch(error){readFailed=true;render(snapshot);status(error.message==='timeout'?'timeout':'failed',true);}finally{loading=false;$('refresh').disabled=!connected;}}
  async function open(target,button){button.disabled=true;try{const response=await send('tools/call',{name:'pulse_open',arguments:{target}});if(response?.isError)throw new Error('tool');status(target==='main'?'requested':target==='details'?'requestedDetails':'requestedWidget');}catch{status('failed',true);}finally{button.disabled=!connected;}}
  window.addEventListener('message',event=>{
    const message=event.data;if(event.source!==parent||!message||message.jsonrpc!=='2.0')return;
    if(!message.method&&Object.hasOwn(message,'id')&&(Object.hasOwn(message,'result')||Object.hasOwn(message,'error'))&&pending.has(message.id)){const request=pending.get(message.id);pending.delete(message.id);clearTimeout(request.timer);message.error?request.reject(new Error('rpc')):request.resolve(message.result);}
    else if(message.method==='ui/notifications/tool-result'){try{result(message.params,true);}catch{readFailed=true;render(snapshot);status('failed',true);}}
    else if(message.method==='ui/notifications/host-context-changed')context(message.params);
    else if(message.method==='ping'&&Object.hasOwn(message,'id'))parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
  });
  document.querySelectorAll('[data-style-choice]').forEach(button=>button.addEventListener('click',()=>{styleChoice=button.dataset.styleChoice;applyPresentation(snapshot);try{if(styleChoice==='follow')localStorage.removeItem('pulse-panel-style');else localStorage.setItem('pulse-panel-style',styleChoice);}catch{}}));
  try{const style=localStorage.getItem('pulse-panel-style');if(style==='clear'||style==='meter'||style==='paper')styleChoice=style;}catch{}
  $('refresh').addEventListener('click',refresh);$('open').addEventListener('click',()=>open('main',$('open')));$('widget').addEventListener('click',()=>open('widget',$('widget')));
  $('details-button').addEventListener('click',()=>open('details',$('details-button')));
  translate();status('connecting');
  if(parent===window){status('unavailable',true);return;}
  send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Codex Pulse',version:'__PULSE_VERSION__'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}}).then(response=>{connected=true;context(response?.hostContext);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');for(const id of ['refresh','open','widget','details-button'])$(id).disabled=false;refresh();}).catch(()=>status('timeout',true));
  setInterval(()=>{if(!document.hidden){render(snapshot);refresh();}},60000);
})();
