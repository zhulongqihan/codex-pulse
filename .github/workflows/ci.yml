name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: React + Rust · Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      npm_config_cache: ${{ github.workspace }}/.local/cache/npm
      CARGO_HOME: ${{ github.workspace }}/.local/cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/target
      TEMP: ${{ github.workspace }}/.local/tmp
      TMP: ${{ github.workspace }}/.local/tmp
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Prepare workspace caches
        run: New-Item -ItemType Directory -Force $env:TEMP,$env:CARGO_HOME,$env:CARGO_TARGET_DIR | Out-Null
      - name: Set up pnpm
        run: npm install --global pnpm@10.20.0
      - name: Check versions and public source boundaries
        run: |
          pnpm version:check
          pnpm source:check
          pnpm test:tooling
          node --test scripts/production-candidate.test.mjs
      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir .local/cache/pnpm
      - name: Check TypeScript contracts
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Test Rust engine and desktop contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build application
        run: pnpm exec tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
      - name: Verify native windows using synthetic sources
        id: native_parity
        run: pnpm exec wdio run ./wdio.pulse.conf.ts
      - name: Verify notice read state across native windows
        if: ${{ success() || steps.native_parity.outcome == 'failure' }}
        run: pnpm test:e2e:notice
      - name: Show synthetic native diagnostics on failure
        if: failure()
        run: |
          foreach ($nativeFolder in @('.local/native-parity', '.local/native-notice-sync')) {
            $nativeOutput = Join-Path $env:GITHUB_WORKSPACE $nativeFolder
            if (Test-Path -LiteralPath $nativeOutput) {
              Get-ChildItem -LiteralPath $nativeOutput -File -Filter '*.log' -Recurse | ForEach-Object {
                Write-Output "::group::Native log: $($_.Name)"
                Get-Content -LiteralPath $_.FullName -Tail 250
                Write-Output '::endgroup::'
              }
              foreach ($name in @('native-titlebar-evidence.json', 'native-parity-evidence.json', 'native-notice-sync-evidence.json')) {
                $evidence = Join-Path $nativeOutput $name
                if (Test-Path -LiteralPath $evidence) {
                  Write-Output "::group::Synthetic native evidence: $name"
                  Get-Content -LiteralPath $evidence -Raw
                  Write-Output '::endgroup::'
                }
              }
            }
          }
      - name: Verify the shipped Codex installer against the built executable
        run: |
          $env:CODEX_PULSE_TEST_EXE = Join-Path $env:CARGO_TARGET_DIR 'debug/codex-pulse.exe'
          node --test scripts/install-codex-plugin.test.mjs
